spring:
  application:
    name: hr-analytics-ingestion
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:employeedb
    driverClassName: org.h2.Driver
    username: sa
    password: password
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration

